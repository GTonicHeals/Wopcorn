<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <!-- viewport-fit=cover is what makes env(safe-area-inset-bottom) resolve. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

    <title>Wopcorn</title>
    <meta name="description" content="Track what you have watched, and what is next.">

    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">

    <meta name="theme-color" content="#12100E" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#FAF7F2" media="(prefers-color-scheme: light)">
    <meta name="color-scheme" content="dark light">

    <script>
      /*
       * Applies the saved theme before first paint. Without this the page renders
       * once in the OS theme and then flips, which is worse than either theme.
       * Keep the key in sync with THEME_STORAGE_KEY in src/stores/theme.ts.
       */
      (function () {
        try {
          var saved = window.localStorage.getItem('wopcorn.theme');
          if (saved === 'light' || saved === 'dark') {
            document.documentElement.setAttribute('data-theme', saved);
          }
        } catch (error) {
          /* Storage unavailable — fall through to the OS preference. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
